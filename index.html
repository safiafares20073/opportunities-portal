<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="بوابة موحدة للطلاب والخريجين اليمنيين لاكتشاف المنح الدراسية والدورات التدريبية وفرص التدريب المهني المعتمدة.">
  <title>بوابة الفرص — للطلاب والشباب في اليمن</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-source="data/opportunities.json">

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="container header-content">
      <div class="brand-wrapper">
        <div class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">بوابة الفرص</h1>
          <p class="brand-subtitle">دليلك الموثوق للمنح الدراسية والدورات والتدريب المهني</p>
        </div>
      </div>

      <!-- View Toggle: All / Favorites -->
      <div class="view-tabs" role="tablist" aria-label="عرض الفرص">
        <button type="button"
                id="tab-all"
                class="view-tab active"
                role="tab"
                aria-selected="true"
                aria-controls="opportunities-grid">
          جميع الفرص
        </button>
        <button type="button"
                id="tab-favorites"
                class="view-tab"
                role="tab"
                aria-selected="false"
                aria-controls="opportunities-grid">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          المحفوظات
          <span id="favorites-count-badge" class="favorites-badge" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" role="main">

    <!-- Search & Filter Controls -->
    <section class="search-filters-section" aria-label="أدوات البحث والتصفية">
      <div class="container">
        
        <!-- Keyword Search -->
        <div class="search-box-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" 
                 id="search-input" 
                 class="search-input" 
                 placeholder="ابحث بالاسم، المؤسسة، التخصص، أو الكلمات المفتاحية..." 
                 aria-label="البحث في الفرص"
                 autocomplete="off">
          <button type="button" 
                  id="search-clear-btn" 
                  class="search-clear-btn" 
                  aria-label="مسح حقل البحث">
            &times;
          </button>
        </div>

        <!-- Filter Dropdowns Grid -->
        <div class="filters-grid">
          
          <!-- Category Filter -->
          <div class="filter-group">
            <label for="filter-category" class="filter-label">نوع الفرصة</label>
            <select id="filter-category" class="filter-select" aria-label="تصفية حسب نوع الفرصة">
              <option value="">جميع الأنواع</option>
            </select>
          </div>

          <!-- Field Filter -->
          <div class="filter-group">
            <label for="filter-field" class="filter-label">المجال والتخصص</label>
            <select id="filter-field" class="filter-select" aria-label="تصفية حسب المجال">
              <option value="">جميع التخصصات</option>
            </select>
          </div>

          <!-- Country Filter -->
          <div class="filter-group">
            <label for="filter-country" class="filter-label">الدولة / الوجهة</label>
            <select id="filter-country" class="filter-select" aria-label="تصفية حسب الدولة">
              <option value="">جميع الوجهات</option>
            </select>
          </div>

          <!-- Deadline Status Filter -->
          <div class="filter-group">
            <label for="filter-status" class="filter-label">حالة التقديم</label>
            <select id="filter-status" class="filter-select" aria-label="تصفية حسب حالة التقديم">
              <option value="">جميع الحالات</option>
              <option value="متاحة">متاحة</option>
              <option value="تغلق قريبًا">تغلق قريبًا</option>
              <option value="منتهية">منتهية</option>
            </select>
          </div>

        </div>

      </div>
    </section>

    <!-- Opportunities Listing & Results Section -->
    <section class="opportunities-section">
      <div class="container">
        
        <!-- Results Toolbar -->
        <div class="results-toolbar">
          <div id="results-count" class="results-count" aria-live="polite">
            جاري فحص الفرص المتاحة...
          </div>
          <button type="button" 
                  id="reset-filters-btn" 
                  class="reset-filters-btn" 
                  style="display: none;" 
                  aria-label="إعادة تعيين جميع المرشحات">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>إعادة تعيين المرشحات</span>
          </button>
        </div>

        <!-- Cards Grid -->
        <div id="opportunities-grid" class="opportunities-grid" aria-label="قائمة الفرص"></div>

        <!-- Empty State Container -->
        <div id="empty-state-container" style="display: none;"></div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>بوابة الفرص — مشروع التخرج | جميع الفرص تخضع للتحقق اليدوي والمستقل بنسبة 100%</p>
    </div>
  </footer>

  <!-- ===================================================
       Opportunity Details Modal (US3)
       RTL Arabic, accessible, mobile-first
       =================================================== -->
  <div id="details-modal"
       class="modal-overlay"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-title"
       aria-hidden="true"
       style="display: none;">

    <div class="modal-panel" role="document">

      <!-- Modal Header -->
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">تفاصيل الفرصة</h2>
        <button type="button"
                id="modal-close-btn"
                class="modal-close-btn"
                aria-label="إغلاق نافذة التفاصيل">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Modal Body — populated by JS -->
      <div id="modal-body" class="modal-body"></div>

    </div>
  </div>
  <!-- End Modal -->

  <script src="js/app.js"></script>
</body>
</html>
